name: Replace Colours Second Draft

on:
  workflow_dispatch:

jobs:
  replace-text:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Debug - Show what files contain the text
        run: |
          echo -e "\n=== FILES CONTAINING DVP ==="
          grep -l 'style="color: #[CD][0-9A-F][0-9A-F][0-9A-F][0-9A-F];">\*\*DVP\*\*' . -r --include="*.dry" || echo "No DVP found"
      
      - name: Replace codes
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import re
          
          # Define all replacements
          replacements = [
              # DVP variations
              ('<span style="color: #C0A054;">**DVP**</span>', '<span style="color: [+ dvp_colour +];">**DVP**</span>'),
              ('<span style="color: #D5AC27;">**DVP**</span>', '<span style="color: [+ dvp_colour +];">**DVP**</span>'),

              # Weimar Coalitions
              ('was_in_weimar_coalition_prussia = 1', 'former_prussia_gov = "Weimar"'),
              ('was_in_weimar_coalition_prussia == 1', 'former_prussia_gov == "Weimar"'),
              ('in_weimar_coalition_prussia = 1', 'prussia_gov = "Weimar"'),
              ('in_weimar_coalition_prussia == 1', 'prussia_gov == "Weimar"'),
              ('in_weimar_coalition_prussia', 'prussia_gov == "Weimar"'),
              ('was_in_weimar_coalition_prussia', 'former_prussia_gov == "Weimar"'),

              # Grand Coalitions
              ('was_in_grand_coalition_prussia = 1', 'former_prussia_gov = "Grand"'),
              ('was_in_grand_coalition_prussia == 1', 'former_prussia_gov == "Grand"'),
              ('in_grand_coalition_prussia = 1', 'prussia_gov = "Grand"'),
              ('in_grand_coalition_prussia == 1', 'prussia_gov == "Grand"'),
              ('in_grand_coalition_prussia', 'prussia_gov == "Grand"'),
              ('was_in_grand_coalition_prussia', 'former_prussia_gov == "Grand"'),

              # SocLib Coalitions
              ('was_in_social_liberal_coalition_prussia = 1', 'former_prussia_gov = "Social-Liberal"'),
              ('was_in_social_liberal_coalition_prussia == 1', 'former_prussia_gov == "Social-Liberal"'),
              ('in_social_liberal_coalition_prussia = 1', 'prussia_gov = "Social-Liberal"'),
              ('in_social_liberal_coalition_prussia == 1', 'prussia_gov == "Social-Liberal"'),
              ('in_social_liberal_coalition_prussia', 'prussia_gov == "Social-Liberal"'),
              ('was_in_social_liberal_coalition_prussia', 'former_prussia_gov == "Social-Liberal"'),

              # SocCath Coalitions
              ('was_in_social_catholic_coalition_prussia = 1', 'former_prussia_gov = "Social-Catholic"'),
              ('was_in_social_catholic_coalition_prussia == 1', 'former_prussia_gov == "Social-Catholic"'),
              ('in_social_catholic_coalition_prussia = 1', 'prussia_gov = "Social-Catholic"'),
              ('in_social_catholic_coalition_prussia == 1', 'prussia_gov == "Social-Catholic"'),
              ('was_in_social_catholic_coalition_prussia', 'former_prussia_gov == "Social-Catholic"'),
              ('in_social_catholic_coalition_prussia', 'prussia_gov == "Social-Catholic"'),

              # Bourgeois Coalitions
              ('was_in_center_right_coalition_prussia = 1', 'former_prussia_gov = "Bourgeois"'),
              ('was_in_center_right_coalition_prussia == 1', 'former_prussia_gov == "Bourgeois"'),
              ('in_center_right_coalition_prussia = 1', 'prussia_gov = "Bourgeois"'),
              ('in_center_right_coalition_prussia == 1', 'prussia_gov == "Bourgeois"'),
              ('was_in_center_right_coalition_prussia', 'former_prussia_gov == "Bourgeois"'),
              ('in_center_right_coalition_prussia', 'prussia_gov == "Bourgeois"'),

              # Right Coalitions
              ('was_in_right_coalition_prussia = 1', 'former_prussia_gov = "Right"'),
              ('was_in_right_coalition_prussia == 1', 'former_prussia_gov == "Right"'),
              ('in_right_coalition_prussia = 1', 'prussia_gov = "Right"'),
              ('in_right_coalition_prussia == 1', 'prussia_gov == "Right"'),
              ('in_right_coalition_prussia', 'prussia_gov == "Right"'),
              ('was_in_right_coalition_prussia', 'former_prussia_gov == "Right"'),

              # PopFront Coalitions
              ('was_in_popular_front_coalition_prussia = 1', 'former_prussia_gov = "Popular-Front"'),
              ('was_in_popular_front_coalition_prussia == 1', 'former_prussia_gov == "Popular-Front"'),
              ('in_popular_front_coalition_prussia = 1', 'prussia_gov = "Popular-Front"'),
              ('in_popular_front_coalition_prussia == 1', 'prussia_gov == "Popular-Front"'),
              ('was_in_popular_front_coalition_prussia', 'former_prussia_gov == "Popular-Front"'),
              ('in_popular_front_coalition_prussia', 'prussia_gov == "Popular-Front"'),

              # Left Coalitions
              ('was_in_left_front_coalition_prussia = 1', 'former_prussia_gov = "Left"'),
              ('was_in_left_front_coalition_prussia == 1', 'former_prussia_gov == "Left"'),
              ('in_left_front_coalition_prussia = 1', 'prussia_gov = "Left"'),
              ('in_left_front_coalition_prussia == 1', 'prussia_gov == "Left"'),
              ('was_in_left_front_coalition_prussia', 'former_prussia_gov == "Left"'),
              ('in_left_front_coalition_prussia', 'prussia_gov == "Left"'),

              # SPD Coalitions
              ('was_in_spd_majority_prussia = 1', 'former_prussia_gov = "SPD"'),
              ('was_in_spd_majority_prussia == 1', 'former_prussia_gov == "SPD"'),
              ('in_spd_majority_prussia = 1', 'prussia_gov = "SPD"'),
              ('in_spd_majority_prussia == 1', 'prussia_gov == "SPD"'),
              ('was_in_spd_majority_prussia', 'former_prussia_gov == "SPD"'),
              ('in_spd_majority_prussia', 'prussia_gov == "SPD"'),

              # NSDAP Coalitions
              ('was_in_far_right_coalition_prussia = 1', 'former_prussia_gov = "Far-Right"'),
              ('was_in_far_right_coalition_prussia == 1', 'former_prussia_gov == "Far-Right"'),
              ('in_far_right_coalition_prussia = 1', 'prussia_gov = "Far-Right"'),
              ('in_far_right_coalition_prussia == 1', 'prussia_gov == "Far-Right"'),
              ('was_in_far_right_coalition_prussia', 'former_prussia_gov == "Far-Right"'),
              ('in_far_right_coalition_prussia', 'prussia_gov == "Far-Right"'),
          ]
          
          total_replacements = 0
          files_modified = []
          
          # Walk through all .dry files
          for root, dirs, files in os.walk('.'):
              if '.git' in root:
                  continue
              
              for filename in files:
                  if filename.endswith('.dry'):
                      filepath = os.path.join(root, filename)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          modified_content = content
                          file_modified = False
                          
                          for old, new in replacements:
                              if old in modified_content:
                                  count = modified_content.count(old)
                                  modified_content = modified_content.replace(old, new)
                                  file_modified = True
                                  total_replacements += count
                          
                          if file_modified:
                              with open(filepath, 'w', encoding='utf-8') as f:
                                  f.write(modified_content)
                              files_modified.append(filepath)
                              print(f"✅ MODIFIED: {filepath}")
                      except Exception as e:
                          print(f"⚠️  Error with {filepath}: {e}")
          
          print(f"\n{'='*50}")
          print(f"📊 SUMMARY:")
          print(f"   Files modified: {len(files_modified)}")
          print(f"   Total replacements: {total_replacements}")
          print(f"{'='*50}")
          
          if len(files_modified) == 0:
              print("\n⚠️  NO FILES WERE MODIFIED!")
              print("   This means the exact text wasn't found in any .dry files.")
              print("   Check the debug output above to see what was found.")
          PYTHON_SCRIPT
      
      - name: Commit changes if any were made
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Replace hardcoded colors with dynamic variables"
          file_pattern: "*.dry"
